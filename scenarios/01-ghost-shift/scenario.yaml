# ─── Objectifs ───────────────────────────────────────────────────────────────
objectives:
  - id: briefing
    title: Lire le briefing de Nadia Kessler
    description: La RSSI de Lumen Grid vous a écrit. Ouvrez l'app Mail.
    trigger: { event: mail.open, where: { messageId: briefing-0417.nk@lumengrid.fr } }
    hints:
      - L'app Mail est ouverte au démarrage. Sinon, cliquez sur l'enveloppe dans le dock.

  - id: phish
    title: Le vecteur d'entrée
    description: >
      Comment l'attaquant a-t-il obtenu les identifiants d'Elias ? Identifiez le domaine
      utilisé pour le piéger.
    requires: [briefing]
    answer:
      label: Domaine frauduleux
      placeholder: ex. exemple.com
      accept: [lumengr1d.com, vpn.lumengr1d.com, support@lumengr1d.com, https://vpn.lumengr1d.com/renew]
      normalize: [trim, lower, nospace]
    hints:
      - Parcourez la boîte de réception d'Elias de la veille au soir. Un message « IT » sort du lot.
      - Comparez l'adresse de l'expéditeur au vrai domaine de l'entreprise (lumengrid.fr). Regardez chaque lettre.
      - Le domaine remplace le « i » de lumengrid par un « 1 ».

  - id: intrusion-ip
    title: L'origine de la connexion
    description: Depuis quelle adresse IP l'attaquant s'est-il connecté à cette machine cette nuit ?
    requires: [briefing]
    answer:
      label: Adresse IP source
      placeholder: ex. 203.0.113.10
      accept: [185.220.101.47]
      normalize: [trim, nospace]
    hints:
      - Les connexions SSH sont journalisées dans /var/log/auth.log. L'app Logs sait filtrer.
      - Filtrez sur « Accepted » ou « Failed password ». Les en-têtes du mail suspect (Received:) contiennent aussi une IP… la même ?
      - "Ligne de 02:47:12 : Accepted password for elias from …"
    onComplete:
      - { deliver: 02-kessler-ip.eml }

  - id: persistence
    title: Ce qu'il a laissé derrière lui
    description: L'attaquant est resté 27 minutes. Trouvez le script qu'il a installé pour garder un pied sur la machine.
    requires: [intrusion-ip]
    trigger: { event: fs.read, where: { path: /home/elias/.cache/.sync/sync.sh } }
    hints:
      - Les tâches planifiées d'un utilisateur se listent avec `crontab -l`. Le syslog montre aussi des lignes CRON qui reviennent.
      - Le chemin pointe dans un dossier caché du home. `ls -a` ou « Afficher les fichiers cachés » dans Files.
      - "cat ~/.cache/.sync/sync.sh"

  - id: c2
    title: Où partent les données
    description: Le script exfiltre quelque chose. Vers quel domaine ?
    requires: [persistence]
    answer:
      label: Domaine de destination
      placeholder: ex. collect.example.net
      accept: [drop.k4de.net, https://drop.k4de.net, https://drop.k4de.net/ingest, drop.k4de.net/ingest]
      normalize: [trim, lower, nospace]
    hints:
      - La destination n'est pas écrite en clair. La variable ressemble à un encodage très courant.
      - "Le terminal sait décoder : echo '<valeur>' | base64 -d"
    onComplete:
      - { deliver: 03-kessler-c2.eml }

  - id: root
    title: Les clés du royaume
    description: Pour agir sur le système, il vous faut les droits root. Trouvez le mot de passe d'Elias.
    requires: [briefing]
    trigger: { event: auth.sudo, where: { ok: true } }
    hints:
      - Elias réutilise ses mots de passe et n'a pas de gestionnaire. Il s'aide de pense-bêtes… et ses photos en disent long.
      - Regardez la photo du bureau dans ~/Pictures, puis les métadonnées (panneau ⓘ de l'app Images, ou `exiftool`) des autres photos. Ou relisez son historique de commandes, on y tape parfois ce qu'il ne faut pas.
      - "Prénom du chat + année d'adoption, avec la majuscule : sudo -i puis Pixel2019"

  - id: abort
    title: Arrêter JOB-0417
    description: Annulez le déploiement avant 09:00. La procédure d'urgence est documentée quelque part.
    requires: [root]
    trigger: { event: scenario.flag, where: { id: job-aborted } }
    hints:
      - Elias range ses procédures dans ~/Documents/procedures. `lumenctl` sans argument affiche son aide.
      - Le jeton d'override opérateur n'est lisible que par root. L'attaquant est d'ailleurs allé le lire (auth.log, 02:49).
      - "sudo cat /etc/lumen/override.key puis sudo lumenctl abort JOB-0417 --token <jeton>"
    onComplete:
      - { deliver: 04-kessler-abort.eml }

  - id: attribution
    title: Signer le rapport
    description: Le SOC veut un nom. Quel pseudonyme l'attaquant a-t-il laissé derrière lui ?
    requires: [phish, intrusion-ip, c2, abort]
    answer:
      label: Pseudonyme de l'attaquant
      placeholder: un seul mot
      accept: [kade, k4de, kade@ghost, kade@ghostshift]
      normalize: [trim, lower, nospace]
    hints:
      - Les attaquants signent souvent sans le vouloir. Regardez le domaine d'exfiltration… et ce qu'il a ajouté pour revenir.
      - "Deux autres traces : la clé dans ~/.ssh/authorized_keys et `strings` sur le firmware dans /tmp/.fw"
    onComplete:
      - { deliver: 05-kessler-final.eml }
      - { end: true }

  # ── Bonus ──
  - id: backdoor-key
    title: "Bonus — la porte dérobée SSH"
    description: Le cron n'était pas sa seule façon de revenir.
    optional: true
    requires: [persistence]
    trigger: { event: fs.read, where: { path: /home/elias/.ssh/authorized_keys } }
    hints:
      - Un attaquant prudent ne se repose pas sur un mot de passe qui peut changer. Où vivent les clés SSH autorisées ?

  - id: firmware
    title: "Bonus — autopsie du firmware"
    description: Prouvez que l'image déployée n'est pas un firmware officiel Lumen.
    optional: true
    requires: [briefing]
    trigger:
      any:
        - { event: cmd.exec, where: { name: strings }, regex: { line: "lumen-fw-4\\.2\\.1" } }
        - { event: cmd.exec, where: { name: sha256sum }, regex: { line: "lumen-fw-4\\.2\\.1" } }
    hints:
      - "`lumenctl show JOB-0417` indique où se trouve l'image."
      - Un binaire ne se lit pas avec `cat`, mais `strings` en extrait le texte. Les empreintes officielles sont dans /opt/lumen/firmware/MANIFEST.sha256.

