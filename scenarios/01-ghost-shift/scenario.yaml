    trigger:
      any:
        - { event: mail.open, where: { messageId: e7b1a3f0.ev@lumengrid.fr } }
        - { event: fs.read, where: { path: /home/elias/Maildir/.Sent/cur/1776358620.M106P2110.ws-varga.eml } }
  - id: ssh-login
    title: Connexion SSH nocturne
    summary: "17/04 02:47:12 — Accepted password for elias from 185.220.101.47 ; sudo sur override.key à 02:49, lumenctl queue à 03:12."
    source: /var/log/auth.log
