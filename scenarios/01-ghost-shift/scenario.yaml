# ─────────────────────────────────────────────────────────────────────────────
#  Kernel_Panic — Scénario 01 : GHOST SHIFT
#  Difficulté : débutant → intermédiaire · ~35-45 min
#  Solution complète : SOLUTION.md (spoilers)
# ─────────────────────────────────────────────────────────────────────────────
id: ghost-shift
version: 1
title: Ghost Shift
subtitle: Une mise à jour de firmware que personne n'a demandée.
summary: >
  Lumen Grid, opérateur du réseau électrique de Valmont. Cette nuit à 03:12, le compte
  de l'administrateur OT Elias Varga a programmé le déploiement d'un firmware non signé
  sur 14 sous-stations. Exécution prévue à 09:00. Elias est en congé, injoignable.
  Vous avez sa station de travail. Et quarante-huit minutes.
difficulty: beginner
estimatedMinutes: 40
locale: fr
contract: { client: "Lumen Grid", fee: 4800 }

machine:
  hostname: ws-varga
  domain: ot.lumengrid.local
  os: LumenOS 22.04.4 LTS
  kernel: 6.8.0-41-lumen
  ip: 10.20.4.17
  clock: 2026-04-17T08:12:00+02:00

defaults:
  mtime: 2026-03-02T10:00:00+02:00

session:
  user: elias
  email: elias@lumengrid.fr
  cwd: /home/elias
  autostart:
    - { app: mail }

users:
  - { name: root, uid: 0, home: /root, shell: /bin/bash }
  - name: elias
    uid: 1000
    fullName: Elias Varga
    home: /home/elias
    shell: /bin/bash
    groups: [adm, sudo, lumen-ops]
    password: Pixel2019
  - { name: lumen-agent, uid: 998, home: /var/lib/lumen, shell: /usr/sbin/nologin }

# Propriétaires/modes par défaut : /home/<u>/** → <u>:<u> 0644 (dossiers 0755, home 0750),
# ailleurs root:root. Surcharges ci-dessous (dernière règle gagnante).
permissions:
  - { path: /root, mode: "0700" }
  - { path: /root/**, mode: "0600" }
  - { path: /etc/shadow, group: shadow, mode: "0640" }
  - { path: /etc/lumen/override.key, mode: "0600", mtime: 2026-04-01T09:30:00+02:00 }
  - { path: /etc/lumen/lumenctl.conf, group: lumen-ops, mode: "0640" }
  - { path: /var/log/auth.log, group: adm, mode: "0640", mtime: 2026-04-17T08:12:00+02:00 }
  - { path: /var/log/syslog, group: adm, mode: "0640", mtime: 2026-04-17T08:10:01+02:00 }
  - { path: /var/log/lumen/lumenctl.log, group: lumen-ops, mode: "0640", mtime: 2026-04-17T03:12:06+02:00 }
  - { path: /var/log/wtmp, group: utmp, mode: "0664", mtime: 2026-04-17T08:12:00+02:00 }
  - { path: /var/spool/cron/crontabs, group: crontab, mode: "0730" }
  - { path: /var/spool/cron/crontabs/elias, owner: elias, group: crontab, mode: "0600", mtime: 2026-04-17T02:52:40+02:00 }
  - { path: /usr/local/bin/lumenctl, group: lumen-ops, mode: "0750" }
  - { path: /tmp, mtime: 2026-04-17T02:58:31+02:00 }
  - { path: /tmp/.fw, owner: elias, mode: "0755", mtime: 2026-04-17T02:58:31+02:00 }
  - { path: /tmp/.fw/lumen-fw-4.2.1-hotfix.img, owner: elias, mtime: 2026-04-17T02:58:31+02:00 }
  - { path: /home/elias/.ssh, mode: "0700" }
  - { path: /home/elias/.ssh/**, mode: "0600" }
  - { path: /home/elias/.ssh/authorized_keys, mtime: 2026-04-17T02:55:13+02:00 }
  - { path: /home/elias/.ssh/known_hosts, mode: "0644" }
  - { path: /home/elias/.cache, mtime: 2026-04-17T02:51:58+02:00 }
  - { path: /home/elias/.cache/.sync, mode: "0755", mtime: 2026-04-17T02:51:58+02:00 }
  - { path: /home/elias/.cache/.sync/sync.sh, mode: "0755", mtime: 2026-04-17T02:51:58+02:00 }
  - { path: /home/elias/.cache/.sync/.last, mtime: 2026-04-17T08:10:02+02:00 }
  - { path: /home/elias/.bash_history, mode: "0600", mtime: 2026-04-16T19:24:51+02:00 }
  - { path: /home/elias/Maildir, mode: "0700" }
  - { path: /home/elias/Maildir/**, mode: "0600" }
  - { path: /home/elias/Documents/notes/todo.md, mtime: 2026-04-16T17:58:00+02:00 }
  - { path: /home/elias/Pictures/pixel.svg, mtime: 2019-03-09T14:02:11+01:00 }

processes:
  - { pid: 1,    user: root,        cmd: /sbin/init splash, start: Apr14 }
  - { pid: 412,  user: root,        cmd: /usr/lib/systemd/systemd-journald, start: Apr14 }
  - { pid: 688,  user: root,        cmd: /usr/sbin/cron -f, start: Apr14 }
  - { pid: 702,  user: root,        cmd: "sshd: /usr/sbin/sshd -D [listener] 0 of 10-100 startups", start: Apr14 }
  - { pid: 731,  user: lumen-agent, cmd: /opt/lumen/bin/lumen-agent --telemetry, cpu: 0.4, start: Apr14 }
  - { pid: 1180, user: root,        cmd: /usr/sbin/NetworkManager --no-daemon, start: Apr14 }
  - { pid: 2210, user: elias,       cmd: /usr/bin/kp-session --forensic, start: "08:12" }
  - { pid: 4242, user: elias,       cmd: -bash, start: "08:12" }

network:
  interfaces:
    - { name: eth0, ip: 10.20.4.17, mac: "3c:52:82:1a:9f:04" }
  connections:
    - { proto: tcp, local: "0.0.0.0:22", remote: "0.0.0.0:*", state: LISTEN, program: 702/sshd }
    - { proto: tcp, local: "10.20.4.17:41822", remote: "10.20.0.40:8443", state: ESTABLISHED, program: 731/lumen-agent }
    - { proto: tcp, local: "10.20.4.17:22", remote: "10.20.9.2:50114", state: ESTABLISHED, program: "2210/kp-session" }
  hosts:
    lumengrid.fr: { ip: 51.159.22.80, http: "<!doctype html><title>Lumen Grid — L'énergie de Valmont</title>" }
    intranet.lumengrid.local: { ip: 10.20.0.12, http: "Lumen Grid Intranet — authentification requise (SSO)." }
    lumengr1d.com: { ip: 185.220.101.47, reachable: false }
    vpn.lumengr1d.com: { ip: 185.220.101.47, reachable: false }
    drop.k4de.net: { ip: 0.0.0.0, reachable: false }
    185.220.101.47: { ip: 185.220.101.47, reachable: false }
    ot-deploy.lumengrid.local: { ip: 10.20.0.40, http: "lumen-deploy gateway 2.3 — use lumenctl" }

commands:
  lumenctl:
    path: /usr/local/bin/lumenctl
    summary: Lumen Grid OT deployment control
    group: lumen-ops
    rules:
      - match: "^(status|jobs)?$"
        unlessFlag: job-aborted
        output: |
          \e[1mlumenctl 2.3.1\e[0m — gateway ot-deploy.lumengrid.local (connected)

          JOB        TARGET          IMAGE                          STATE      SCHEDULED
          JOB-0412   substation-07   lumen-fw-4.1.9.img             \e[32mDONE\e[0m       2026-04-09 22:00
          JOB-0417   substation-*    lumen-fw-4.2.1-hotfix.img      \e[33mQUEUED\e[0m     2026-04-17 09:00  (14 targets)

          use 'lumenctl show <JOB>' for details
      - match: "^(status|jobs)?$"
        ifFlag: job-aborted
        output: |
          \e[1mlumenctl 2.3.1\e[0m — gateway ot-deploy.lumengrid.local (connected)

          JOB        TARGET          IMAGE                          STATE      SCHEDULED
          JOB-0412   substation-07   lumen-fw-4.1.9.img             \e[32mDONE\e[0m       2026-04-09 22:00
          JOB-0417   substation-*    lumen-fw-4.2.1-hotfix.img      \e[31mABORTED\e[0m    —
      - match: "^show JOB-0417$"
        output: |
          Job:         JOB-0417
          Submitted:   2026-04-17 03:12:05 by elias (sudo, tty pts/1)
          Targets:     substation-01 … substation-14
          Image:       /tmp/.fw/lumen-fw-4.2.1-hotfix.img
          Signature:   \e[31mUNSIGNED\e[0m (vendor check bypassed: --force-unsigned)
          Scheduled:   2026-04-17 09:00:00 +02:00
          Rollback:    disabled (--no-rollback)
      - match: "^show JOB-0412$"
        output: |
          Job:         JOB-0412
          Submitted:   2026-04-08 16:41:22 by elias
          Targets:     substation-07
          Image:       /opt/lumen/firmware/lumen-fw-4.1.9.img
          Signature:   \e[32mOK\e[0m (Lumen Systems AG, key 0x4C55)
          State:       DONE (2026-04-09 22:04:51)
      - match: "^show"
        exit: 1
        output: "lumenctl: unknown job"
      - match: "^abort JOB-0417 --token OVR-7Q2K-VX91$"
        requireRoot: true
        unlessFlag: job-aborted
        emit: job-aborted
        once: true
        output: |
          \e[33m[!]\e[0m Operator override accepted (token OVR-****-VX91)
          [..] Contacting ot-deploy.lumengrid.local ...
          [..] Revoking JOB-0417 on 14 targets ...
          \e[32m[ok]\e[0m JOB-0417 aborted. No target received the image.
          [ok] Incident reference written to /var/log/lumen/lumenctl.log
        write:
          path: /var/log/lumen/lumenctl.log
          content: |
            2026-04-17T03:12:05+02:00 INFO  queue job=JOB-0417 by=elias via=sudo targets=14 image=/tmp/.fw/lumen-fw-4.2.1-hotfix.img at=09:00 flags=--force-unsigned,--no-rollback
            2026-04-17T03:12:06+02:00 WARN  JOB-0417 image signature missing — accepted because --force-unsigned
            2026-04-17T08:40:00+02:00 WARN  JOB-0417 ABORTED by operator override (root, pts/0)
      - match: "^abort JOB-0417 --token OVR-7Q2K-VX91$"
        ifFlag: job-aborted
        exit: 1
        output: "lumenctl: JOB-0417 is not queued (state: ABORTED)"
      - match: "^abort JOB-0417 (--token|-t)"
        requireRoot: true
        exit: 1
        output: "lumenctl: invalid operator override token — attempt logged"
      - match: "^abort JOB-0417$"
        exit: 1
        output: |
          lumenctl: aborting a scheduled job requires an operator override token
                    usage: lumenctl abort <JOB> --token <OVERRIDE_TOKEN>
      - match: "^abort"
        exit: 1
        output: "lumenctl: unknown or finished job"
      - match: "^(version|--version|-v)$"
        output: "lumenctl 2.3.1 (Lumen Systems AG) — build 2025-11-03"
    fallback: |
      usage: lumenctl <command> [options]

        status | jobs             list deployment jobs
        show <JOB>                job details
        abort <JOB> --token <T>   abort a scheduled job (root, operator override token)
        version                   print version

      See ~/Documents/procedures/runbook-lumenctl.md

