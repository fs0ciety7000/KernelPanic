    trigger: { event: mail.open, where: { messageId: 20260416164150.77310@lumengr1d.com } }
  - id: reply
    title: La réponse d'Elias
    summary: "16/04 18:57 — Elias confirme avoir « validé » son mot de passe… identique à celui de sa session."
    source: /home/elias/Maildir/.Sent/cur/1776358620.M106P2110.ws-varga.eml
