# ─── Messagerie interne ──────────────────────────────────────────────────────
chat:
  contacts:
    - { id: tomas, name: Tomás Ferreira, role: Technicien OT · astreinte }
    - { id: nadia, name: Nadia Kessler, role: RSSI }
  history:
    tomas:
      - { from: tomas, text: "Tu pars toujours demain ? Le GR20 en avril, t'es fou 😄", at: "2026-04-16T17:31:00+02:00" }
      - { from: me, text: "Ce soir même. Plus de réseau jusqu'au 26, c'est le principe.", at: "2026-04-16T17:33:00+02:00" }
      - { from: tomas, text: "Ok. Je suis d'astreinte, rien de prévu sur les sous-stations de toute façon.", at: "2026-04-16T17:34:00+02:00" }
      - { from: me, text: "Je dois encore renouveler mon VPN, le support m'a relancé. Après ça je coupe tout.", at: "2026-04-16T18:49:00+02:00" }
    nadia:
      - { from: nadia, text: "Je vous ai envoyé le briefing par mail. Lisez-le en premier.", at: "2026-04-17T08:10:00+02:00" }
  nodes:
    - id: tomas-hello
      contact: tomas
      trigger: { event: objective.complete, where: { id: briefing } }
      messages:
        - "Salut, c'est Tomás, l'astreinte OT. Nadia m'a prévenu que vous étiez sur le poste d'Elias."
        - "Je confirme : personne chez nous n'a programmé JOB-0417. Elias est parti hier soir, injoignable."
      replies:
        - { id: ask-vpn, text: "Il parlait d'un renouvellement de VPN hier soir ?", next: tomas-vpn }
