    - id: tomas-vpn
      contact: tomas
      messages:
        - "Oui, un mail du « support » qui le relançait. On n'a pas lancé de renouvellement cette semaine…"
        - "Regardez son historique de navigation, il a dû cliquer depuis ce poste."
      replies:
        - { id: ok, text: "Je regarde.", flags: [tomas-vpn-tip] }
    - id: tomas-ip
      contact: tomas
      trigger: { event: objective.complete, where: { id: intrusion-ip } }
      messages:
        - "185.220.101.47 ? Ce n'est pas une de nos plages. Je le bloque au pare-feu de bordure."
    - id: tomas-firmware
      contact: tomas
      trigger: { event: objective.complete, where: { id: persistence } }
      messages:
        - "Avant de toucher à quoi que ce soit : vous êtes sûr que le firmware est mauvais ? Si je bloque une vraie mise à jour, on me le reprochera."
      replies:
        - id: proof
          text: "Version 4.2.1 inexistante, non signée, watchdog désactivé. Voilà la preuve."
          requiresEvidence: [firmware]
          next: tomas-convinced
        - { id: later, text: "Je vérifie et je reviens vers vous." }
    - id: tomas-convinced
      contact: tomas
      messages:
        - "OK, là c'est clair. Je mets les 14 sous-stations en mode manuel, au cas où."
      onComplete:
        - { flag: substations-manual }
    - id: tomas-countdown
      contact: tomas
      messages:
        - "La passerelle affiche toujours JOB-0417 en file pour 09:00. Je ne peux pas l'annuler sans le jeton d'override, il est sur ta machine."
        - "Si tu as les droits root, c'est maintenant."
    - id: nadia-abort
      contact: nadia
      trigger: { event: objective.complete, where: { id: abort } }
      messages:
        - "La passerelle confirme : JOB-0417 annulé. Merci."
        - "Il me manque un nom pour le rapport. Trouvez-moi qui a signé ça."

