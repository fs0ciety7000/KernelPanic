# lumenctl client configuration
[gateway]
url = https://ot-deploy.lumengrid.local:8443
ca  = /etc/lumen/ca.pem
timeout = 30

[policy]
require_signature = true        ; can be bypassed with --force-unsigned (root only)
max_targets = 32
override_key = /etc/lumen/override.key

[audit]
log = /var/log/lumen/lumenctl.log
