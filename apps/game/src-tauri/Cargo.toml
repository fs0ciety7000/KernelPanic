[package]
name = "kernel-panic"
version = "0.1.0"
description = "Kernel_Panic — hacking investigation game inside a virtual OS"
authors = ["fsociety"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "kernel_panic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
