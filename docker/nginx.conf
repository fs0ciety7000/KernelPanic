# Rendered by the nginx image's envsubst step (/etc/nginx/templates/*.template).
# Only defined environment variables are substituted (${KP_API_UPSTREAM}, ${KP_RESOLVER});
# nginx runtime variables such as $uri are left untouched.

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Showcase site (Astro) -------------------------------------------
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ $uri.html =404;
    }

    # --- Game (SvelteKit SPA, built with KP_BASE=/play) -------------------
    location = /play {
        return 301 /play/;
    }

    location /play/_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location /play/scenarios/ {
        # Scenario bundles are not content-hashed: always revalidate.
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location /play/ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /play/index.html;
    }

    # --- API (Axum) -------------------------------------------------------
    # Upstream resolved at request time (resolver + variable) so nginx starts
    # even when the server service is not deployed; requests then get 502.
    location /api/ {
        resolver ${KP_RESOLVER} valid=30s ipv6=off;
        set $kp_api http://${KP_API_UPSTREAM};
        proxy_pass $kp_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 60s;
        client_max_body_size 4m;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
