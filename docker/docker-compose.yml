# Coolify "Docker Compose" resource. Coolify's proxy (Traefik) routes the
# domain to the `web` service; no host ports are published here.
# In Coolify, assign https://kernel.fsociety.org to service `web` (port 80).
services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      KP_API_UPSTREAM: ${KP_API_UPSTREAM:-server:8080}
      KP_RESOLVER: ${KP_RESOLVER:-127.0.0.11}
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      server:
        condition: service_started
        required: false

  server:
    build:
      context: ../apps/server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      RUST_LOG: ${RUST_LOG:-kp_server=info,tower_http=info}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
